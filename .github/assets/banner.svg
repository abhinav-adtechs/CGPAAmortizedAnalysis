<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="CGPAAmortizedAnalysis — know the GPA you need next semester to hit a 9.0">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="160" cy="40" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="1180" cy="360" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="motif" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.12"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <rect width="1280" height="360" fill="url(#glowA)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect width="1280" height="360" fill="url(#glowB)"/>

    <!-- MOTIF: semester GPA bars rising toward a dashed CGPA target, with a dashed "next semester" bar that lands on it -->
    <g id="motif-group" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M852 52V300H1214" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
      <g fill="url(#bar)" stroke="url(#motif)" stroke-width="2.5">
        <rect x="872" y="230" width="36" height="70" rx="5"/>
        <rect x="928" y="205" width="36" height="95" rx="5"/>
        <rect x="984" y="215" width="36" height="85" rx="5"/>
        <rect x="1040" y="175" width="36" height="125" rx="5"/>
        <rect x="1096" y="150" width="36" height="150" rx="5"/>
      </g>
      <rect x="1152" y="128" width="36" height="172" rx="5" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="7 6" fill="#818cf8" fill-opacity="0.08"/>
      <path d="M852 128H1212" stroke="#34d399" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="6 8"/>
      <path d="M890 230L946 205L1002 215L1058 175L1114 150" stroke="url(#motif)" stroke-width="3.5"/>
      <path d="M1114 150L1170 128" stroke="#818cf8" stroke-width="3" stroke-dasharray="5 6"/>
      <g fill="#34d399" stroke="none">
        <circle cx="890" cy="230" r="5"/>
        <circle cx="946" cy="205" r="5"/>
        <circle cx="1002" cy="215" r="5"/>
        <circle cx="1058" cy="175" r="5"/>
        <circle cx="1114" cy="150" r="5"/>
      </g>
      <circle cx="1170" cy="128" r="6" fill="#111827" stroke="#818cf8" stroke-width="3"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" stroke="none">
        <text x="862" y="118" fill="#6ee7b7">CGPA 9.0</text>
        <text x="1152" y="110" fill="#a5b4fc">next</text>
      </g>
    </g>
  </g>

  <text x="80" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="80" font-weight="800" letter-spacing="-2" fill="url(#title)">CGPA Amortized</text>
  <text x="84" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#cbd5e1">Know the GPA you need next semester to hit a 9.0</text>

  <!-- CHIPS: one <g> per chip; width = chars*10.85 + 32; 14px gap between chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#e2e8f0">
    <g transform="translate(84 256)">
      <rect width="75.4" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="16" y="25">Java</text>
    </g>
    <g transform="translate(173.4 256)">
      <rect width="108" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="16" y="25">Android</text>
    </g>
    <g transform="translate(295.4 256)">
      <rect width="183.9" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="16" y="25">MPAndroidChart</text>
    </g>
    <g transform="translate(493.3 256)">
      <rect width="173" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="16" y="25">10-point CGPA</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="359" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>
